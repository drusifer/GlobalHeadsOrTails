[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sdm-provisioner"
version = "0.1.0"
description = "NTAG424 DNA NFC Tag SDM Provisioner & TUI Tools"
requires-python = ">=3.11"
dependencies = [
    "pyscard>=2.0.0",
    "textual>=0.40.0",
    "pycryptodome>=3.12.0",
    "coolname>=2.2.0",
    "shared",
    "tag-validator-service",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
]

[project.scripts]
provision-tag = "sdm_provisioner.main:cli"
provision-tui = "sdm_provisioner.tui.tui_main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = [
    "-v",
    "--tb=short",
    "--disable-warnings",
]
