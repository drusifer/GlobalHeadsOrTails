apiVersion: v1
kind: Namespace
metadata:
  name: tag-secrets
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tag-validator-sa
  namespace: tag-secrets
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tag-secrets-manager
  namespace: tag-secrets
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tag-validator-secrets-binding
  namespace: tag-secrets
subjects:
  - kind: ServiceAccount
    name: tag-validator-sa
    namespace: tag-secrets
roleRef:
  kind: Role
  name: tag-secrets-manager
  apiGroup: rbac.authorization.k8s.io
