[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tag-validator-service"
version = "0.1.0"
description = "Standalone microservice for managing NTAG 424 DNA tag keys as k3s secrets and performing stateless SDM CMAC validation"
readme = "README.md"
authors = [{ name = "GlobalHeadsOrTails Team" }]
requires-python = ">=3.11"
dependencies = [
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
k3s = [
    "kubernetes>=28.0.0",
]
server = [
    "gunicorn>=21.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
tag-validator = "tag_validator.api.app:main"
tag-secrets-import = "tag_validator.cli.importer:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
